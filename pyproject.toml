[project]
name = "minpycube"
version = "0.1.0"
description = "A minimal Python library for Rubik's Cube simulation."
authors = [
    {name = "mennymendoza", email = "jmen9575@gmail.com"},
]
dependencies = []
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "build>=1.3.0",
    "pytest>=8.4.2",
    "sphinx>=8.1.3",
    "twine>=6.2.0",
]
